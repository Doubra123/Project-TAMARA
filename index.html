<!doctype html>

<html lang="en">
  <head>
    <base href="./" />
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
    />

    <title>TAMARA'- LOGIN</title>
    <meta name="theme-color" content="#ffffff" />
    <!-- Vendors styles-->
    <link rel="stylesheet" href="vendors/simplebar/css/simplebar.css" />
    <link rel="stylesheet" href="css/vendors/simplebar.css" />
    <!-- Main styles for this application-->
    <link href="css/style.css" rel="stylesheet" />

    <script src="js/config.js"></script>
    <script src="js/color-modes.js"></script>
  </head>
  <body>
    <div
      class="min-vh-100 d-flex align-items-center justify-content-center"
      style="background-color: #1e293b"
    >
      <div
        class="card shadow-lg border-0 text-white"
        style="
          width: 100%;
          max-width: 380px;
          background-color: #0f172a;
          border-radius: 10px;
        "
      >
        <div class="card-body p-3">
          <h4
            class="text-center mb-3 fw-bold"
            style="color: #38bdf8; letter-spacing: 0.5px"
          >
            TAMARA LOGIN
          </h4>

          <form id="loginForm">
            <!-- Username Input -->
            <div class="mb-2">
              <label
                for="username"
                class="form-label mb-1"
                style="color: #94a3b8; font-size: 0.85rem"
                >Username or Email</label
              >
              <input
                type="text"
                class="form-control form-control-sm text-white border-secondary"
                id="username"
                placeholder="Enter username"
                style="background-color: #1e293b"
                required
              />
            </div>

            <!-- Password Input with True Eye Icon Toggle -->
            <div class="mb-3">
              <label
                for="password"
                class="form-label mb-1"
                style="color: #94a3b8; font-size: 0.85rem"
                >Password</label
              >
              <div class="input-group input-group-sm position-relative">
                <input
                  type="password"
                  class="form-control text-white border-secondary"
                  id="password"
                  placeholder="Enter password"
                  style="background-color: #1e293b; padding-right: 40px"
                  required
                />
                <!-- Eye Icon Positioned inside the input field -->
                <span
                  id="togglePassword"
                  style="
                    position: absolute;
                    right: 12px;
                    top: 50%;
                    transform: translateY(-50%);
                    cursor: pointer;
                    z-index: 10;
                    color: #94a3b8;
                  "
                >
                  👁️
                </span>
              </div>
            </div>

            <!-- Remember Me & Forgot Password Row -->
            <div
              class="d-flex justify-content-between align-items-center mb-3"
              style="font-size: 0.8rem"
            >
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="rememberMe"
                />
                <label
                  class="form-check-label"
                  for="rememberMe"
                  style="color: #94a3b8"
                  >Remember me</label
                >
              </div>
              <a href="#" style="color: #38bdf8; text-decoration: none"
                >Forgot password?</a
              >
            </div>

            <!-- Sign In Button -->
            <button
              type="submit"
              class="btn btn-sm w-100 py-1.5 fw-semibold text-white"
              style="background-color: #38bdf8; border: none"
            >
              Sign In
            </button>
          </form>

          <!-- Sign Up Option -->
          <div class="text-center mt-3">
            <p class="mb-0" style="color: #94a3b8; font-size: 0.8rem">
              Don't have an account?
              <a
                href="#"
                style="color: #38bdf8; text-decoration: none"
                class="fw-semibold"
                >Sign Up</a
              >
            </p>
          </div>

          <!-- Security Warning Footer -->
          <div
            class="text-center mt-3 pt-2 border-top border-secondary"
            style="font-size: 0.7rem; color: #64748b; line-height: 1.2"
          >
            Secure Authorization Gateway.<br />Unauthorized access attempts are
            strictly monitored.
          </div>
        </div>
      </div>
    </div>

    <!-- Script to handle true icon toggle switching -->
    <script>
      const togglePassword = document.querySelector("#togglePassword");
      const passwordInput = document.querySelector("#password");
      const loginForm = document.querySelector("#loginForm");

      // Toggle password visibility
      togglePassword.addEventListener("click", function () {
        const type =
          passwordInput.getAttribute("type") === "password"
            ? "text"
            : "password";
        passwordInput.setAttribute("type", type);
        this.textContent = type === "password" ? "👁️" : "🙈";
      });

      // Magic shortcut: Redirect to dashboard on click
      loginForm.addEventListener("submit", function (e) {
        e.preventDefault();
        window.location.href = "dashboard.html";
      });
    </script>

    <!-- CoreUI and necessary plugins-->
    <script src="vendors/@coreui/coreui/js/coreui.bundle.min.js"></script>
    <script src="vendors/simplebar/js/simplebar.min.js"></script>

    <script>
      const header = document.querySelector("header.header");

      document.addEventListener("scroll", () => {
        if (header) {
          header.classList.toggle(
            "shadow-sm",
            document.documentElement.scrollTop > 0,
          );
        }
      });
    </script>
  </body>
</html>
